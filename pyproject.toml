[build-system]
requires = ["setuptools==69.5.1", "wheel==0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bistar-benchmark"
version = "1.0.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4", "PyYAML==6.0.2", "opencv-python-headless==4.10.0.84",
  "pandas==2.2.2", "matplotlib==3.9.2", "scikit-image==0.23.2",
  "pydantic==2.7.4", "torch==2.4.0", "torchvision==0.19.0",
  "timm==0.4.12", "einops==0.8.0", "lpips==0.1.4", "tqdm==4.66.4",
  "rich==13.7.1"
]

[project.optional-dependencies]
test = ["pytest==8.2.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
