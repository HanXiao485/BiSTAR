experiment:
  name: ablation
  seed: 0
  output_dir: outputs/ablation
  save_videomae_videos: true
dataset:
  config: configs/datasets/bistar_eval.yaml
  split: test
ablation:
  budget_mode: visible_patch_count
  visible_patch_counts: [20, 40, 60]
  variants:
    - random
    - gaze_only
    - temporal_only
    - edge_only
    - structural_only
    - gaze_temporal
    - gaze_edge
    - bistar_full
bistar:
  config: configs/codecs/bistar.yaml
