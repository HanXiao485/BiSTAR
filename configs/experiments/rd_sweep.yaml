experiment: {name: rd_sweep, seed: 0, output_dir: outputs/rd_sweep}
dataset: {config: configs/datasets/bistar_eval.yaml, split: test}
rd: {target_bitrates_kbps: [50, 75, 100, 150, 200, 300], bitrate_match_tolerance_percent: 5.0, max_match_iterations: 8}
methods:
  h264: {enabled: true, config: configs/codecs/h264.yaml}
  h265: {enabled: true, config: configs/codecs/h265.yaml}
  bistar: {enabled: true, config: configs/codecs/bistar.yaml}
quality_metrics: [psnr, ssim, ms_ssim, lpips]
