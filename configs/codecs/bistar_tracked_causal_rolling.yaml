codec:
  name: bistar_tracked_causal_rolling
  implementation: focus_tracked_window_video
  window:
    width: 48
    height: 48
    alignment: 16
    update_interval: 2
    tracking_mode: center_follow
    deadband_pixels: 0
    focus_source: gaze
    missing_focus_policy: frame_center
  encoder:
    codec_name: libx264
    preset: fast
    tune: zerolatency
    mode: bitrate
    bitrate_kbps: 15
    crf: 22
    pixel_format: yuv420p
    gop_size: 16
    b_frames: 0
  reconstruction:
    type: videomae
    mode: causal_rolling
    window_frames: 16
    inference_stride: 1
    startup_padding: repeat_first
    output_frame: last
    dynamic_mask: true
    preserve_received_pixels: true
    future_frames_used: false
