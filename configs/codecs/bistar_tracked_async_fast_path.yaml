codec:
  name: bistar_tracked_async_fast_path
  implementation: focus_tracked_window_video
  window:
    width: 48
    height: 48
    alignment: 16
    update_interval: 2
    tracking_mode: center_follow
    deadband_pixels: 0
    focus_source: gaze
    missing_focus_policy: frame_center
  encoder:
    codec_name: libx264
    preset: fast
    tune: zerolatency
    mode: bitrate
    bitrate_kbps: 15
    crf: 22
    pixel_format: yuv420p
    gop_size: 16
    b_frames: 0
  reconstruction:
    type: videomae
    mode: async_fast_path
    window_frames: 16
    inference_stride: 2
    startup_padding: repeat_first
    startup_background: black
    queue_size: 1
    drop_policy: keep_latest
    current_roi_fast_path: true
    dynamic_mask: true
    preserve_received_pixels: true
    future_frames_used: false
